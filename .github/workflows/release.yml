name: Release

# Pushing a tag like v0.1.0 builds both Mac architectures and publishes a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="probeg-${{ matrix.target }}.tar.gz"
          tar -czf "$name" -C "target/${{ matrix.target }}/release" probeg
          shasum -a 256 "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: probeg-*

  publish:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" probeg-* --repo "${{ github.repository }}" --generate-notes
