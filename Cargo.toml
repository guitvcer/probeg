[package]
name = "probeg"
version = "0.1.0"
edition = "2024"
description = "Lifetime statistics for your Mac"
license = "MIT"
readme = "README.md"
repository = "https://github.com/guitvcer/probeg"
keywords = ["macos", "statistics", "system-info", "cli", "neofetch"]
categories = ["command-line-utilities", "os::macos-apis"]
exclude = ["docs/", ".github/", ".claude/", ".githooks/", "scripts/"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
plist = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
